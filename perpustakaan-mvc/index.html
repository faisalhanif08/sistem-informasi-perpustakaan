<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perpustakaan Digital</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="brand">
          <span class="logo">📖</span>
          <div><b>Perpustakaan</b><small>Digital Library</small></div>
        </div>
        <nav>
          <a href="#/dashboard" data-r="dashboard">🏠 <span>Dashboard</span></a>
          <a href="#/" data-r="katalog">📚 <span>Katalog Buku</span></a>
          <a href="#/peminjaman" data-r="peminjaman"
            >📋 <span>Peminjaman</span></a
          >
          <a href="#/persetujuan" data-r="persetujuan" id="navPersetujuan" hidden
            >✅ <span>Persetujuan</span></a
          >
          <a href="#/denda" data-r="denda" id="navDenda" hidden
            >💰 <span>Denda</span></a
          >
          <a href="#/profil" data-r="profil">👤 <span>Profil</span></a>
          <a id="logout">🚪 <span>Logout</span></a>
        </nav>
      </aside>
      <div class="main">
        <header>
          <div class="search">
            🔍<input
              id="hq"
              placeholder="Cari buku, penulis, atau kategori..."
            />
          </div>
          <div class="user">
            <span>🔔</span>
            <div class="avatar">👤</div>
            <div id="userInfo">Tamu<small>Belum login</small></div>
          </div>
        </header>
        <main id="app"></main>
      </div>
    </div>
    <div id="toast"></div>

    <!-- UTIL -->
    <script src="js/utils.js"></script>

    <!-- API (pemanggil backend Express) -->
    <script src="js/api.js"></script>

    <!-- MODEL -->
    <script src="js/models/Pengguna.js"></script>
    <script src="js/models/Buku.js"></script>
    <script src="js/models/Reservasi.js"></script>
    <script src="js/models/Peminjaman.js"></script>
    <script src="js/models/Denda.js"></script>

    <!-- CONTROLLER -->
    <script src="js/controllers/KatalogController.js"></script>
    <script src="js/controllers/ReservasiController.js"></script>
    <script src="js/controllers/RiwayatController.js"></script>
    <script src="js/controllers/DashboardController.js"></script>
    <script src="js/controllers/ProfilController.js"></script>
    <script src="js/controllers/AuthController.js"></script>
    <script src="js/controllers/PersetujuanController.js"></script>
    <script src="js/controllers/DendaController.js"></script>

    <!-- VIEW -->
    <script src="js/views/HalamanKatalog.js"></script>
    <script src="js/views/HalamanDetailBuku.js"></script>
    <script src="js/views/HalamanRiwayat.js"></script>
    <script src="js/views/HalamanDashboard.js"></script>
    <script src="js/views/HalamanProfil.js"></script>
    <script src="js/views/HalamanLogin.js"></script>
    <script src="js/views/HalamanPersetujuan.js"></script>
    <script src="js/views/HalamanDaftarPeminjaman.js"></script>
    <script src="js/views/HalamanDenda.js"></script>

    <!-- ROUTER -->
    <script src="js/router.js"></script>

    <!-- ENTRY POINT -->
    <script src="js/app.js"></script>
  </body>
</html>
